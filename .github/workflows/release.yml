name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build Python wheel + sdist (once, on ubuntu)
  # ---------------------------------------------------------------------------
  build-wheel:
    name: Build Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build frontend
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload Python packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Build self-contained executables (matrix: os × variant)
  # ---------------------------------------------------------------------------
  build-exe:
    name: Build ${{ matrix.variant }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        variant: [backend, webgui, pyqt]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # webgui only: build the Vue 3 frontend first
      # -----------------------------------------------------------------------
      - name: Set up Node.js (webgui only)
        if: matrix.variant == 'webgui'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vue 3 frontend (webgui only)
        if: matrix.variant == 'webgui'
        working-directory: transistordatabase/gui_web
        run: |
          npm ci
          npm run build

      # -----------------------------------------------------------------------
      # pyqt + ubuntu: Qt xcb platform plugin dependencies
      # -----------------------------------------------------------------------
      - name: Install Qt xcb dependencies (pyqt + ubuntu only)
        if: matrix.variant == 'pyqt' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 \
            libgl1-mesa-glx libglib2.0-0 libdbus-1-3

      # -----------------------------------------------------------------------
      # Install Python dependencies + PyInstaller
      # -----------------------------------------------------------------------
      - name: Install package and PyInstaller
        run: pip install -e .[webgui,pyqt] pyinstaller

      # -----------------------------------------------------------------------
      # Run PyInstaller
      # -----------------------------------------------------------------------
      - name: Build executable with PyInstaller
        run: >
          pyinstaller packaging/tdb_${{ matrix.variant }}.spec
          --distpath exe-dist/

      # -----------------------------------------------------------------------
      # Rename artefacts to include OS suffix
      # -----------------------------------------------------------------------
      - name: Rename executable (Linux)
        if: runner.os == 'Linux'
        run: mv exe-dist/tdb-${{ matrix.variant }} exe-dist/tdb-${{ matrix.variant }}-linux

      - name: Rename executable (macOS)
        if: runner.os == 'macOS'
        run: mv exe-dist/tdb-${{ matrix.variant }} exe-dist/tdb-${{ matrix.variant }}-macos

      - name: Rename executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item exe-dist\tdb-${{ matrix.variant }}.exe `
                    exe-dist\tdb-${{ matrix.variant }}-windows.exe

      # -----------------------------------------------------------------------
      # Upload artefact
      # -----------------------------------------------------------------------
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.variant }}-${{ matrix.os }}
          path: exe-dist/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Publish GitHub Release with all artefacts
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-wheel, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
